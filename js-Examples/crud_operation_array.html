        function LoadData() {
            document.getElementById("ShowData").innerHTML = "";
            movieDetails.forEach((value) => {
                const col = document.createElement("div");
                col.className = "col-3";
                col.innerHTML = `
                    <div class="card m-3">
                        <div class="card-header">
                            <img class="card-img-top" src="${value.img}" alt="">
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">${value.name}</h5>
                            <span class="d-inline-flex align-items-center border text-primary px-2 py-1 rounded">ID:
                                ${value.id}</span>
                            <div><span class="bi bi-image "></span><span class="mx-2">${value.img}</span>
                            </div>
                        </div>
                        <div class="card-footer d-flex justify-content-center align-items-center">
                          <button onclick= "ClickEdit(${value.id})" data-bs-target="#movieUpdate" data-bs-toggle="modal" class="btn btn-warning edit-btn col-6 mx-2 " data-id="${value.id}">
                                 Edit
                        </button>

                        <button class="btn btn-outline-danger delete-btn col-6  " onclick="Clickdelete(${value.id})" data-id="${value.id}">
                        <span class="bi bi-trash"></span>
                        Delete
                        </button>
                        </div>
                    </div> `;
                const ShowData = document.getElementById("ShowData");
                ShowData.appendChild(col);
            })
        }

        let editId = null;
        function ClickEdit(id) {
          editId  = id;
            const title = document.getElementById("movieName");
           const movie =  movieDetails.find(x => (x.id === id));
            title.innerHTML = movie.name;
            document.getElementById("newPath").value = movie.img;
            document.getElementById("newName").value = movie.name;

            
           
        }
         function ClickUpdate(){
              const newName = document.getElementById("newName").value;
            const newPath = document.getElementById("newPath").value;
            let  movie = movieDetails.find(x =>(x.id === editId));
            

           movie.name = newName;
            movie.img = newPath;
            LoadData();
        }

      

        function AddClick() {
            var AddName = document.getElementById("name").value;
            var Addimg = document.getElementById("img").value;
            var newMovie = {
                id: movieDetails.length > 0 ? movieDetails[movieDetails.length - 1].id + 1 : 100,
                name: AddName,
                img: Addimg
            };
            movieDetails.push(newMovie);
            LoadData();
            document.getElementById("name").value = "";
            document.getElementById("img").value = ""
        }

        function deleteAll() {
            movieDetails.length = 0;
            LoadData();
        }

        function Clickdelete(id) {
            const index = movieDetails.findIndex(x => x.id === id);
            if (index != -1) {
                movieDetails.splice(index, 1);
                LoadData();
            }
        }

        function sortAsc() {
            movieDetails.sort((a, b) => a.name.localeCompare(b.name));
            LoadData();
        }
        function sortDesc() {
            movieDetails.sort((a, b) => a.name.localeCompare(b.name)).reverse();

            LoadData();
        }

                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">

            <p>This is a simple example of CRUD operations performed on an array.</p>
        </nav>
        <main class="d-flex row">
            <aside class="border border-2 bg-light col-2 rounded ">
                <h6 class="bi bi-tools">Operations</h6>
                <button class="btn btn-success m-2 " onclick="sortAsc()">Sort-ASC</button>
                <button class="btn btn-success m-2 " onclick="sortDesc()">Sort-desc </button>
                <button class="btn btn-danger m-2 " onclick="deleteAll()">Delete all</button>
                <hr>
                <div class="card m-2 p-2 ">
                    <label for="name   ">Name</label>
                    <input id="name" required name="name" type="text" class="m-2 p-2">
                    <label for="img">Img</label>
                    <input name="img" required id="img" type="text" placeholder="/Public/images/image-[numbers]" class="m-2 p-2">
                    <button onclick="AddClick()" class="btn btn-primary m-2 ">Add</button>

                </div>
            </aside>
            <section id="ShowData" class="border border-2 bg-light col-10 rounded d-flex  row justify-content-between">
            </section>
        </main>
