<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Will You Go on a Date With Me? 💖</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3,
        #c471ed,
        #6a82fb
      );
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated background */
    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Main card */
    .love-card {
      position: relative;
      z-index: 10;
      width: min(92%, 550px);
      padding: 50px 35px;
      text-align: center;
      border-radius: 30px;

      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.25),
        inset 0 0 30px rgba(255, 255, 255, 0.12);

      animation: cardAppear 1.2s ease-out;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(60px) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Heart */
    .main-heart {
      font-size: 75px;
      display: inline-block;
      animation:
        heartbeat 1.3s infinite,
        heartFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 15px rgba(255, 0, 80, 0.35));
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.18);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.12);
      }
      60% {
        transform: scale(1);
      }
    }

    @keyframes heartFloat {
      0%, 100% {
        translate: 0 0;
      }
      50% {
        translate: 0 -12px;
      }
    }

    h1 {
      color: white;
      font-family: "Pacifico", cursive;
      font-size: clamp(2rem, 7vw, 3.3rem);
      margin: 20px 0;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    .question {
      color: white;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    /* Buttons */
    .btn-love {
      border: none;
      border-radius: 50px;
      padding: 13px 30px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .btn-yes {
      color: #fff;
      background: linear-gradient(135deg, #ff1744, #ff4081);
      box-shadow: 0 8px 20px rgba(255, 23, 68, 0.4);
    }

    .btn-yes:hover {
      color: white;
      transform: translateY(-5px) scale(1.06);
      box-shadow: 0 15px 30px rgba(255, 23, 68, 0.55);
    }

    .btn-maybe {
      color: #fff;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .btn-maybe:hover {
      color: white;
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-5px);
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -50px;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-110vh)
          rotate(360deg)
          scale(1.5);
        opacity: 0;
      }
    }

    /* Success screen */
    #success {
      display: none;
    }

    .success-title {
      font-family: "Pacifico", cursive;
      color: white;
      font-size: 2.5rem;
    }

    .success-text {
      color: white;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      color: white;
      font-size: 20px;
      animation: sparkle 2s infinite ease-in-out;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    .s1 {
      top: 10%;
      left: 15%;
      animation-delay: .2s;
    }

    .s2 {
      top: 20%;
      right: 12%;
      animation-delay: .7s;
    }

    .s3 {
      bottom: 15%;
      left: 10%;
      animation-delay: 1.2s;
    }

    .s4 {
      bottom: 20%;
      right: 15%;
      animation-delay: 1.7s;
    }

    /* Mobile */
    @media (max-width: 576px) {
      .love-card {
        padding: 40px 22px;
      }

      .main-heart {
        font-size: 60px;
      }

      .question {
        font-size: 1rem;
      }

      .btn-love {
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>
</head>

<body>

  <!-- Sparkles -->
  <div class="sparkle s1">✨</div>
  <div class="sparkle s2">✨</div>
  <div class="sparkle s3">✨</div>
  <div class="sparkle s4">✨</div>

  <!-- Main Card -->
  <div class="love-card">

    <!-- Question Screen -->
    <div id="questionScreen">

      <div class="main-heart">💖</div>

      <h1>Hey, You! ❤️</h1>

      <p class="question">
        I have a little question for you... 👀
        <br>
        Would you like to go on a date with me?
        🌹✨
      </p>

      <div class="d-flex justify-content-center gap-3 flex-wrap">

        <button
          class="btn btn-love btn-yes"
          onclick="sayYes()"
        >
          Yes! ❤️
        </button>

        <button
          class="btn btn-love btn-maybe"
          onclick="sayMaybe()"
        >
          Maybe... 😊
        </button>

      </div>

    </div>

    <!-- Success Screen -->
    <div id="success">

      <div class="main-heart">🥰</div>

      <div class="success-title">
        It's a Date! 💕
      </div>

      <p class="success-text mt-3">
        You just made my day! ✨
        <br>
        I can't wait to spend some time with you. 🌹
        <br><br>
        So... where should we go? 😍
      </p>

      <button
        class="btn btn-love btn-yes mt-3"
        onclick="createHearts(30)"
      >
        More Love 💖
      </button>

    </div>

  </div>

  <script>

    // Create floating hearts
    function createHeart() {

      const heart = document.createElement("div");

      heart.classList.add("heart");

      const hearts = ["❤️", "💕", "💖", "💗", "💓", "💘", "💝"];

      heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        (15 + Math.random() * 30) + "px";

      heart.style.animationDuration =
        (5 + Math.random() * 6) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 12000);
    }

    // Constant heart animation
    setInterval(createHeart, 450);


    // Yes button
    function sayYes() {

      document.getElementById("questionScreen").style.display = "none";

      document.getElementById("success").style.display = "block";

      createHearts(50);
    }


    // Maybe button
    function sayMaybe() {

      const button = document.querySelector(".btn-maybe");

      const messages = [
        "Are you sure? 🥺",
        "Think about it... 💕",
        "I'll bring snacks! 🍫",
        "One cute date? 🌹",
        "Pretty please? 🥹",
        "Okay... I'll wait 😌"
      ];

      button.innerText =
        messages[Math.floor(Math.random() * messages.length)];

      // Move button slightly
      const x = (Math.random() - 0.5) * 100;
      const y = (Math.random() - 0.5) * 50;

      button.style.transform =
        `translate(${x}px, ${y}px)`;
    }


    // Burst of hearts
    function createHearts(amount) {

      for (let i = 0; i < amount; i++) {

        setTimeout(() => {
          createHeart();
        }, i * 50);

      }
    }

  </script>

</body>
</html>
