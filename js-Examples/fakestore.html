<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <title>Document</title>

    <script>
        function LoadCategory(url) {
        
            fetch(url)
                .then((response) => {
                    return response.json();
                })
                .then((categories) => {
                    categories.unshift("All");
                    categories.map((category) => {

                        let option = document.createElement("option");
                        let list = document.createElement("option");
                        option.text = category.toUpperCase();
                        option.value = category;
                        list.value = category;
                        document.getElementById("search-categories").appendChild(option);
                        document.getElementById("category_list").appendChild(list);
                    })

                })
        }


        function LoadProduct(url) {
             document.getElementById("All_Product").innerText = "";
            fetch(url)
                .then((response) => {
                    return response.json();
                })
                .then((products) => {
                    products.map((product) => {

                        let div = document.createElement("div");
                        div.className = "card mx-5 mt-4 p-3 w-25 rounded-4 shadow";
                        div.innerHTML = `<div class="card-img-top d-flex justify-content-center align-items-center ">
                              <img src="${product.image}" alt="" width="150px">
    </div>
    <div class="card-header">
        <div class="card-title">${product.title}</div>
    </div>
    <div class="card-body">
        <div class="fs-4 fw-bold "> ${product.price.toLocaleString("en-in", {style:"currency",currency:"INR"})}</div>
        
    </div>
    <div class="card-footer d-flex justify-content-between aling-items-center">
        <button class="btn btn-warning">Buy Now</button>
        <button class="btn btn-warning">Add to cart</button>
    </div>`;

        document.getElementById("All_Product").appendChild(div);



                    })
                })
        }

        function categoryChange() {
          let category =    document.getElementById("search-categories").value;
            if(category === "All"){
                LoadProduct(`https://fakestoreapi.com/products`);
            }else{
            LoadProduct(`https://fakestoreapi.com/products/category/${category}`);
            }
        }

          function searchClick() {
            let search_value = document.getElementById("search_product").value;
            if(search_value === ""){
                LoadProduct(`https://fakestoreapi.com/products`);
            }else{
            LoadProduct(`https://fakestoreapi.com/products/category/${search_value}`);
            }
        }

        function bodyload() {
            LoadCategory("http://fakestoreapi.com/products/categories");
            LoadProduct("https://fakestoreapi.com/products");
        }

      
    
    </script>
</head>

<body onload="bodyload()">
    
    <div class="container-fluid ">
        <header class="bg-secondary m-2 p-3 d-flex  justify-content-between align-items-center rounded-4">
            <div class="fs-5 fw-bold"><span class="text-danger fs-3">F</span>akestore</div>
             <div class="input-group w-50">
                    <span class="input-group-text" id="basic-addon1">All</span>
                <input type="text" list="category_list" class="form-control " placeholder="Search the product" id="search_product">
                <datalist id="category_list"></datalist>
                <button onclick="searchClick()" class="btn btn-warning bi bi-search"></button>
            </div>

            <div class=""><span class="bi bi-cart4 bg-warning fs-2 rounded-2 p-2"></span></div>
        </header>
        <section class="row">
            <div class="col-2 bg-light rounded-3">
                <select onchange="categoryChange()" name="" id="search-categories" class="form-select mt-4"></select>
                <ul class="list-group">

                </ul>
            </div>

            <div class="col-10 bg-info rounded-5 d-flex flex-wrap " id="All_Product" >
                
            </div>
        </section>
    </div>
</body>

</html>
