<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script>
        var cityName = "Hyderabad";
        var Api_key = "18fb9c417a643ed922500979e37a3d22";
function fahrenheitToCelsius(fahrenheit) {
  return (fahrenheit - 32) * 5 / 9;
}

            function loadData() {
        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=${Api_key}&units=metric`)
            .then((response) => {
                return response.json();
            })
            .then((data) => {
                document.getElementById("lblCity").innerHTML = data.name;

                document.getElementById("lblDescription").innerHTML =
                    data.weather[0].description;

                document.getElementById("lblTemp").innerHTML =
                    `${data.main.temp.toFixed(0)}&deg;C`;

                document.getElementById("windSpeed").innerHTML =
                    `${data.wind.speed.toLocaleString("en-IN", {
                        style: "unit",
                        unit: "kilometer-per-hour"
                    })} <span class="bi bi-wind"></span>`;

                document.getElementById("windDeg").innerHTML =
                    `${data.wind.deg}°C`;

                document.getElementById("mainPressure").innerHTML =
                    `${data.main.pressure} hPa <span class="bi bi-pressure"></span>`;

                document.getElementById("mainHumadity").innerHTML =
                    `${data.main.humidity}% <span class="bi bi-thermometer"></span>`;

            });
        }

            function searchClick() {
                cityName = document.getElementById("lblName").value;
                loadData();
            }

             function linkclick(name) {
                cityName = name;
                loadData();
            }
    </script>
</head>

<body class="container-fluid bg-secondary" onload="loadData()">
    <header class="bg-light m-5 p-4 rounded-2">

        <div>
            <div class="input-group m-3">
                <span class="input-group-text "><span class="bi bi-geo-alt"></span></span>
                <input type="text" name="" placeholder="Your city Name" id="lblName" class="form-control">
                <button  onclick="searchClick()" class="btn btn-warning bi bi-search"></button>
            </div>
        </div>


        <div class="d-flex justify-content-around mt-3">
            <a href="javascript:linkclick('Delhi')">Delhi</a>
            <a href="javascript:linkclick('Hyderabad')">Hyderabad</a>
            <a href="javascript:linkclick('Mumbai')">Mumbai</a>
            <a href="javascript:linkclick('Chennai')">Chennai</a>
        </div>

    </header>
    <section class="m-5 p-5 bg-light rounded-5 justify-content-center align-items-center">
        <div class="row gap-5">
            <div class="col-8  rounded-5 mx-4 p-5" style="
background: linear-gradient(to right, #51a7e0, #75b0c6, #a7a4a4);">


                <div class="card-header">

                    <span id="lblCity" class="fs-3 fw-bold"></span>

                    <div class="mt-2 fs-5 fw-bold fst-italic" id="lblDescription"> </div>

                    <div class="card-body">

                        <div class="row">
                            <div class="col">
                                <div class="bi bi-cloud fs-1"></div>
                                <div id="lblTemp" class="fw-bold" style="font-size: 100px;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-3 rounded-5 bg-warning">
                <div class="m-2 p-2">
                    <div id="windSpeed"
                        class="m-3 p-3 d-flex justify-content-center align-items-center  bg-dark rounded text-white">
                    </div>
                    <div id="windDeg"
                        class="m-3 p-3 d-flex justify-content-center align-items-center  bg-dark rounded text-white">
                    </div>
                    <div id="mainPressure"
                        class="m-3 p-3 d-flex justify-content-center align-items-center  bg-dark rounded text-white">
                    </div>
                    <div id="mainHumadity"
                        class="m-3 p-3 d-flex justify-content-center align-items-center  bg-dark rounded text-white">
                    </div>
                </div>
            </div>

        </div>


    </section>
</body>

</html>
