<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DummyJSON Products</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-5">Products</h1>

        <div class="row g-4" id="productContainer">
            <!-- Cards will come here -->
        </div>
 <div class="row g-4" id="productContainer1">
            <!-- Cards will come here -->
        </div>
    </div>


    <script>

        fetch("https://dummyjson.com/products")

            .then((response) => {
                return response.json();
            })

            .then((data) => {
                console.log(data);
                // products is an array
                data.products.map((product) => {

                    document.getElementById("productContainer").innerHTML += `

                        <div class="col-md-6 col-lg-4">

                            <div class="card h-100 shadow-sm">

                                <!-- Product Image -->
                                <img 
                                    src="${product.thumbnail}"
                                    class="card-img-top border shadow"
                                    style="height:250px; object-fit:contain;"
                                    alt="${product.title}"
                                >

                                <div class="card-body">

                                    <!-- Category -->
                                    <span class="badge bg-primary mb-2">
                                        ${product.category}
                                    </span>

                                    <!-- Title -->
                                    <h5 class="card-title">
                                        ${product.title}
                                    </h5>

                                    <!-- Description -->
                                    <p class="card-text text-muted">
                                        ${product.description}
                                    </p>

                                    <!-- Rating -->
                                    <p>
                                         <strong>${product.rating}</strong>
                                    </p>

                                    <hr>

                                    <!-- Product Details -->

                                    <p class="mb-1">
                                        <strong>Brand:</strong>
                                        ${product.brand}
                                    </p>

                                    <p class="mb-1">
                                        <strong>SKU:</strong>
                                        ${product.sku}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Price:</strong>
                                        $${product.price}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Discount:</strong>
                                        ${product.discountPercentage}%
                                    </p>

                                    <p class="mb-1">
                                        <strong>Stock:</strong>
                                        ${product.stock}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Weight:</strong>
                                        ${product.weight} g
                                    </p>

                                    <p class="mb-1">
                                        <strong>Availability:</strong>
                                        ${product.availabilityStatus}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Minimum Order:</strong>
                                        ${product.minimumOrderQuantity}
                                    </p>

                                    <hr>

                                    <!-- Shipping -->
                                    <p class="mb-1">
                                        🚚 ${product.shippingInformation}
                                    </p>

                                    <!-- Warranty -->
                                    <p class="mb-1">
                                        🛡️ ${product.warrantyInformation}
                                    </p>

                                    <!-- Return Policy -->
                                    <p class="mb-1">
                                        ↩️ ${product.returnPolicy}
                                    </p>

                                </div>

                                <div class="card-footer bg-white">

                                    <button class="btn btn-primary w-100">
                                        Add to Cart
                                    </button>

                                </div>

                            </div>

                        </div>

                    `;
                });

            })

            .catch((error) => {
                console.log("Error:", error);
            });

            fetch("https://dummyjson.com/carts")

            .then((response) => {
                return response.json();
            })

            .then((data) => {
                console.log(data);
                // products is an array
                data.products.map((product) => {

                    document.getElementById("productContainer1").innerHTML += `

                        <div class="col-md-6 col-lg-4">

                            <div class="card h-100 shadow-sm">

                                    style="height:250px; object-fit:contain;"
                                    alt="${product.title}"
                                >

                                <div class="card-body">

                                    <!-- Category -->
                                    <span class="badge bg-primary mb-2">
                                        ${product.category}
                                    </span>

                                    <!-- Title -->
                                    <h5 class="card-title">
                                        ${product.title}
                                    </h5>

                                    <!-- Description -->
                                    <p class="card-text text-muted">
                                        ${product.description}
                                    </p>

                                    <!-- Rating -->
                                    <p>
                                         <strong>${product.rating}</strong>
                                    </p>

                                    <hr>

                                    <!-- Product Details -->

                                    <p class="mb-1">
                                        <strong>Brand:</strong>
                                        ${product.brand}
                                    </p>

                                    <p class="mb-1">
                                        <strong>SKU:</strong>
                                        ${product.sku}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Price:</strong>
                                        $${product.price}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Discount:</strong>
                                        ${product.discountPercentage}%
                                    </p>

                                    <p class="mb-1">
                                        <strong>Stock:</strong>
                                        ${product.stock}

                                    <p class="mb-1">

                                        ${product.weight} g

                                    <p class="mb-1">

                                        ${product.availabilityStatus}
                                    </p>

                                    <p class="mb-1">
                                        <strong>Minimum Order:</strong>
                                        ${product.minimumOrderQuantity}
                                    </p>

                                    <hr>

                                    <!-- Shipping -->
                                    <p class="mb-1">

                                    </p>

                                    <!-- Warranty -->
                                    <p class="mb-1">
                                        🛡️ ${product.warrantyInformation}
                                    </p>

                                    <!-- Return Policy -->
                                    <p class="mb-1">
                                        ↩️ ${product.returnPolicy}
                                    </p>

                                </div>

                                <div class="card-footer bg-white">

                                    <button class="btn btn-primary w-100">
                                        Add to Cart
                                    </button>

                                </div>

                            </div>

                        </div>

                    `;
                });

            })

            .catch((error) => {
                console.log("Error:", error);
            });

    </script>

</body>

</html>
